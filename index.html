<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');
        body {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            font-family: 'Noto Serif', serif;
            max-width: 1200px;
            background-color: #ffff;
            color: #000;
        }
        header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: right;
        }

        p, h1, h2, h3, a, ul {
            margin: 0;
            padding: 0;
            text-decoration: none;
            color: #000;
        }
        
        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 40px;
        }
        h3 {
            text-transform: capitalize;
            margin-bottom: 20px;
        }
        .limpar-logs {
            cursor: pointer;
            outline: 0;
            color: #fff;
            background-color: #fd0d0d;
            border-color: #fd0d0d;
            display: inline-block;
            font-weight: 400;
            line-height: 1.5;
            text-align: center;
            border: 1px solid transparent;
            padding: 6px 12px;
            font-size: 16px;
            border-radius: .25rem;
            transition: color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;   
        }
        .log-access {
            background-color: hsla(102, 100%, 50%, 0.425);
        }
        .log-blocked {
            background-color: hsla(0, 100%, 50%, 0.425);
        }
    </style>
</head>

<body class="w3-dark-mode">
    <h1>Logs</h1>
    <header> 
        <h3>Confira as atividades recentes no seu portão:</h3>
    </header>
    <h4>
    <!-- REPLACE DIV -->
    </h4>
    <button id="limparLogs" class="limpar-logs">Limpar Logs</button>

    <script>
        const limparLogsButton = document.getElementById('limparLogs');
        const logsContainer = document.querySelector('h4');
        limparLogsButton.addEventListener('click', () => {
            if (confirm('Tem certeza que deseja limpar os logs?')) {
                logsContainer.innerHTML = '<!-- REPLACE DIV -->';
            }
        });
    </script>
</body>
</html>
